name: Idea or rule variant
description: Suggest a feature, a movie pack, or how your family plays
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and why would it make the game better?
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Rules (for variants)
      description: How does your version of the game work?
